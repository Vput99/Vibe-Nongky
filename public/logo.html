<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Nongky • 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;family=Playfair+Display:wght@700&amp;display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #2a2a3a 0%, #0f0f1e 70%);
            font-family: 'Inter', system_ui, sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .overlay {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        
        .logo-text {
            font-family: 'Playfair Display', sans-serif;
            font-size: 4.8rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -6px;
            color: #0c2540;
            text-shadow: 
                0 0 10px #4cc9f0,
                0 0 30px #4cc9f0,
                4px 6px 0 #132d4e;
            user-select: none;
        }
        
        .logo-text2 {
            font-size: 5.8rem;
            margin-top: -18px;
            letter-spacing: -8px;
        }
        
        .tagline {
            font-size: 1.1rem;
            letter-spacing: 8px;
            color: #4cc9f0;
            margin-top: 8px;
            text-transform: uppercase;
            font-weight: 400;
            opacity: 0.9;
            text-shadow: 0 0 15px rgba(76, 201, 240, 0.6);
        }
        
        .header {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ff8a00;
            text-shadow: 0 0 20px #ff8a00;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }
        
        .header::before {
            content: '';
            display: block;
            width: 28px;
            height: 3px;
            background: linear-gradient(to right, transparent, #ff8a00);
        }
        
        .info {
            position: absolute;
            bottom: 30px;
            right: 40px;
            background: rgba(255,255,255,0.1);
            color: #aaa;
            font-size: 0.8rem;
            padding: 6px 18px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 30;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(255,140,0,0.25) 0%, rgba(0,180,255,0.15) 50%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            animation: pulse 8s ease-in-out infinite;
            border-radius: 50%;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
            50% { opacity: 0.85; transform: translate(-50%, -50%) scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    
    <div class="header">
        <span>3D LOGO</span>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div class="overlay">
        <div class="logo-text">VIBE</div>
        <div class="logo-text logo-text2">NONGKY</div>
        <div class="tagline">Coffee Vibes</div>
    </div>
    
    <div class="info">
        <span style="display: inline-block; width: 8px; height: 8px; background: #4cc9f0; border-radius: 50%; animation: ping 2s infinite;"></span>
        DRAG TO ROTATE • SCROLL TO ZOOM
    </div>
    
    <script>
        // Three.js setup
        let scene, camera, renderer;
        let pinMesh, glowMesh;
        let mouseX = 0, mouseY = 0;
        let targetRotationY = 0;
        let currentRotationY = 0;
        let isDragging = false;
        let previousMouseX = 0;
        let particles = [];
        
        const canvas = document.getElementById('canvas');
        
        function init() {
            // Scene setup
            scene = new THREE.Scene();
            
            // Camera
            camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0.8, 5.5);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            
            // Lights
            const hemiLight = new THREE.HemisphereLight(0xffeedd, 0x112244, 0.9);
            scene.add(hemiLight);
            
            const dirLight = new THREE.DirectionalLight(0xffeecc, 1.2);
            dirLight.position.set(5, 8, 6);
            scene.add(dirLight);
            
            const dirLight2 = new THREE.DirectionalLight(0x88ccff, 0.8);
            dirLight2.position.set(-8, 5, -6);
            scene.add(dirLight2);
            
            // Point light for glow
            const pointLight = new THREE.PointLight(0xff8800, 3.5, 100);
            pointLight.position.set(0, 1.5, 2);
            scene.add(pointLight);
            
            const pointLight2 = new THREE.PointLight(0x00aaff, 2.5, 100);
            pointLight2.position.set(0, -2, 3);
            scene.add(pointLight2);
            
            // Create the 3D pin
            createPin();
            
            // Create floating particles (steam / vibe effect)
            createParticles();
            
            // Event listeners
            window.addEventListener('resize', onResize);
            canvas.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('wheel', onWheel);
            
            // Touch support
            canvas.addEventListener('touchstart', onTouchStart);
            canvas.addEventListener('touchmove', onTouchMove);
            canvas.addEventListener('touchend', onMouseUp);
            
            // Initial render
            animate();
        }
        
        function createCanvasTexture() {
            const size = 512;
            const texCanvas = document.createElement('canvas');
            texCanvas.width = size;
            texCanvas.height = size * 1.28;
            const ctx = texCanvas.getContext('2d');
            
            const centerX = size / 2;
            const centerY = size * 0.42;
            const pinWidth = size * 0.62;
            
            // Glow underlay
            const glowGrad = ctx.createRadialGradient(
                centerX, centerY - 40, pinWidth * 0.4,
                centerX, centerY + 80, pinWidth * 1.1
            );
            glowGrad.addColorStop(0, 'rgba(255, 160, 20, 0.35)');
            glowGrad.addColorStop(1, 'rgba(80, 220, 255, 0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.ellipse(centerX, centerY + 30, pinWidth * 0.72, pinWidth * 1.05, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Main pin gradient
            const pinGradient = ctx.createLinearGradient(
                centerX, centerY - 125,
                centerX, centerY + 165
            );
            pinGradient.addColorStop(0, '#ff6a00');
            pinGradient.addColorStop(0.45, '#ff8c00');
            pinGradient.addColorStop(0.7, '#00b2ff');
            pinGradient.addColorStop(1, '#0088dd');
            
            ctx.shadowColor = '#ffaa33';
            ctx.shadowBlur = 42;
            
            // Draw pin shape
            ctx.fillStyle = pinGradient;
            ctx.beginPath();
            // Tip of pin
            ctx.moveTo(centerX, centerY + 165);
            // Left curve
            ctx.quadraticCurveTo(
                centerX - pinWidth / 2, centerY + 65,
                centerX - pinWidth / 2, centerY - 35
            );
            // Top curve
            ctx.quadraticCurveTo(
                centerX - pinWidth / 2, centerY - 125,
                centerX, centerY - 145
            );
            // Right curve
            ctx.quadraticCurveTo(
                centerX + pinWidth / 2, centerY - 125,
                centerX + pinWidth / 2, centerY - 35
            );
            // Right lower curve
            ctx.quadraticCurveTo(
                centerX + pinWidth / 2, centerY + 65,
                centerX, centerY + 165
            );
            ctx.closePath();
            ctx.fill();
            
            // Inner highlight stroke
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(255,255,255,0.6)';
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = 22;
            ctx.stroke();
            
            // Reset shadow for inner details
            ctx.shadowBlur = 0;
            
            // Inner orange circle
            const innerRadius = pinWidth * 0.36;
            const innerX = centerX;
            const innerY = centerY - 32;
            
            const innerGrad = ctx.createRadialGradient(
                innerX - 18, innerY - 28, 10,
                innerX + 12, innerY + 18, innerRadius * 1.1
            );
            innerGrad.addColorStop(0, '#ffeb3b');
            innerGrad.addColorStop(1, '#ff4d00');
            
            ctx.fillStyle = innerGrad;
            ctx.beginPath();
            ctx.arc(innerX, innerY, innerRadius, 0, Math.PI * 2);
            ctx.fill();
            
            // Inner circle border
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 18;
            ctx.beginPath();
            ctx.arc(innerX, innerY, innerRadius + 6, 0, Math.PI * 2);
            ctx.stroke();
            
            // Coffee cup drawing
            const cupX = innerX;
            const cupY = innerY + 8;
            const cupW = innerRadius * 0.78;
            
            ctx.strokeStyle = '#1a2a3a';
            ctx.lineWidth = 11;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            // Cup body
            ctx.beginPath();
            ctx.moveTo(cupX - cupW * 0.48, cupY - 12);
            ctx.quadraticCurveTo(
                cupX - cupW * 0.48, cupY + 28,
                cupX - cupW * 0.4, cupY + 38
            );
            ctx.lineTo(cupX + cupW * 0.4, cupY + 38);
            ctx.quadraticCurveTo(
                cupX + cupW * 0.5, cupY + 30,
                cupX + cupW * 0.5, cupY - 12
            );
            ctx.stroke();
            
            // Cup top rim
            ctx.beginPath();
            ctx.ellipse(cupX + 2, cupY - 12, cupW * 0.5, 11, 0, 0, Math.PI * 2);
            ctx.stroke();
            
            // Coffee inside
            ctx.fillStyle = '#e85d0c';
            ctx.beginPath();
            ctx.ellipse(cupX + 1, cupY - 13, cupW * 0.36, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Cup handle
            ctx.beginPath();
            ctx.moveTo(cupX + cupW * 0.48, cupY - 8);
            ctx.quadraticCurveTo(
                cupX + cupW * 0.92, cupY - 12,
                cupX + cupW * 0.95, cupY + 18
            );
            ctx.quadraticCurveTo(
                cupX + cupW * 0.9, cupY + 36,
                cupX + cupW * 0.55, cupY + 38
            );
            ctx.stroke();
            
            // Steam
            ctx.strokeStyle = '#f8f1e3';
            ctx.lineWidth = 9;
            ctx.shadowColor = '#f8f8d8';
            ctx.shadowBlur = 12;
            
            // Steam 1
            ctx.beginPath();
            ctx.moveTo(cupX - 18, cupY - 42);
            ctx.quadraticCurveTo(cupX - 38, cupY - 72, cupX - 15, cupY - 95);
            ctx.stroke();
            
            // Steam 2
            ctx.beginPath();
            ctx.moveTo(cupX + 8, cupY - 48);
            ctx.quadraticCurveTo(cupX + 32, cupY - 68, cupX + 12, cupY - 105);
            ctx.stroke();
            
            // Steam 3
            ctx.beginPath();
            ctx.moveTo(cupX + 30, cupY - 39);
            ctx.quadraticCurveTo(cupX + 55, cupY - 55, cupX + 42, cupY - 83);
            ctx.stroke();
            
            // Small highlight on inner circle
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.beginPath();
            ctx.arc(innerX - 24, innerY - 32, 18, 0, Math.PI * 2);
            ctx.fill();
            
            return new THREE.CanvasTexture(texCanvas);
        }
        
        function createPin() {
            const texture = createCanvasTexture();
            texture.anisotropy = 16;
            
            // Create the pin shape
            const shape = new THREE.Shape();
            const w = 1.4;
            const h = 2.1;
            
            // Starting from the tip (bottom)
            shape.moveTo(0, h * 0.72);
            // Curve to left bottom
            shape.quadraticCurveTo(-w * 0.5, h * 0.25, -w * 0.5, -h * 0.05);
            // Curve to top left
            shape.quadraticCurveTo(-w * 0.5, -h * 0.65, 0, -h * 0.78);
            // Curve to top right
            shape.quadraticCurveTo(w * 0.5, -h * 0.65, w * 0.5, -h * 0.05);
            // Curve to right bottom
            shape.quadraticCurveTo(w * 0.5, h * 0.25, 0, h * 0.72);
            
            const extrudeSettings = {
                depth: 0.18,
                bevelEnabled: true,
                bevelThickness: 0.1,
                bevelSize: 0.05,
                bevelSegments: 12,
                curveSegments: 16
            };
            
            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            
            // Center the geometry
            geometry.center();
            geometry.translate(0, 0.1, 0);
            
            const material = new THREE.MeshPhongMaterial({
                map: texture,
                shininess: 68,
                specular: 0xffffff,
                flatShading: false,
                transparent: false,
                side: THREE.DoubleSide
            });
            
            pinMesh = new THREE.Mesh(geometry, material);
            pinMesh.scale.set(2.1, 2.1, 1.8);
            pinMesh.rotation.x = Math.PI * -0.02;
            pinMesh.castShadow = true;
            pinMesh.receiveShadow = true;
            scene.add(pinMesh);
            
            // Create a larger back glow mesh (slightly bigger and transparent)
            const glowShape = shape.clone();
            const glowGeometry = new THREE.ExtrudeGeometry(glowShape, {
                depth: 0.05,
                bevelEnabled: true,
                bevelThickness: 0.2,
                bevelSize: 0.22,
                bevelSegments: 8
            });
            glowGeometry.center();
            glowGeometry.translate(0, 0.1, 0);
            
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0xffaa33,
                transparent: true,
                opacity: 0.16,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide
            });
            
            glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
            glowMesh.scale.set(2.35, 2.35, 1);
            glowMesh.rotation.x = Math.PI * -0.02;
            glowMesh.position.z = -0.2;
            scene.add(glowMesh);
            
            // Add a very subtle bottom point highlight
            const pointGeometry = new THREE.ConeGeometry(0.18, 0.6, 4);
            const pointMaterial = new THREE.MeshPhongMaterial({
                color: 0x0099ff,
                shininess: 10,
                emissive: 0x003366,
                emissiveIntensity: 0.6
            });
            const tipMesh = new THREE.Mesh(pointGeometry, pointMaterial);
            tipMesh.rotation.x = Math.PI;
            tipMesh.position.set(0, -2.05, 0.05);
            tipMesh.scale.set(1, 1.2, 1);
            pinMesh.add(tipMesh);
        }
        
        function createParticles() {
            const particleCount = 38;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount * 3; i += 3) {
                const i3 = i;
                positions[i3] = (Math.random() - 0.5) * 1.8;
                positions[i3 + 1] = Math.random() * 1.8 - 1.8;
                positions[i3 + 2] = (Math.random() - 0.5) * 1.2;
                
                sizes[i / 3] = Math.random() * 0.1 + 0.04;
                
                // Soft orange to white colors
                const intensity = Math.random();
                colors[i3] = 1;
                colors[i3 + 1] = 0.9 + intensity * 0.1;
                colors[i3 + 2] = 0.7 + intensity * 0.3;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.08,
                vertexColors: true,
                transparent: true,
                opacity: 0.75,
                blending: THREE.AdditiveBlending,
                depthTest: false
            });
            
            const particleSystem = new THREE.Points(geometry, material);
            particleSystem.position.y = 0.9;
            scene.add(particleSystem);
            
            // Store for animation
            particles.push({
                mesh: particleSystem,
                positions: positions,
                speeds: new Float32Array(particleCount).map(() => Math.random() * 0.008 + 0.006)
            });
        }
        
        function onMouseDown(e) {
            isDragging = true;
            previousMouseX = e.clientX;
        }
        
        function onMouseUp() {
            isDragging = false;
        }
        
        function onMouseMove(e) {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
            
            if (isDragging) {
                const delta = (e.clientX - previousMouseX) * 0.0045;
                targetRotationY += delta;
                previousMouseX = e.clientX;
            }
        }
        
        function onTouchStart(e) {
            if (e.touches.length === 1) {
                isDragging = true;
                previousMouseX = e.touches[0].clientX;
            }
        }
        
        function onTouchMove(e) {
            if (e.touches.length === 1) {
                e.preventDefault();
                mouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouseY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
                
                if (isDragging) {
                    const delta = (e.touches[0].clientX - previousMouseX) * 0.0045;
                    targetRotationY += delta;
                    previousMouseX = e.touches[0].clientX;
                }
            }
        }
        
        function onWheel(e) {
            camera.position.z += e.deltaY * 0.012;
            camera.position.z = Math.max(3.5, Math.min(9, camera.position.z));
        }
        
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.0015;
            
            // Gentle floating animation
            if (pinMesh) {
                currentRotationY = currentRotationY * 0.82 + targetRotationY * 0.18;
                pinMesh.rotation.y = currentRotationY + Math.sin(time * 0.6) * 0.03;
                pinMesh.position.y = Math.sin(time * 1.2) * 0.06;
                
                // Glow mesh follows
                glowMesh.rotation.y = pinMesh.rotation.y;
                glowMesh.position.y = pinMesh.position.y;
            }
            
            // Animate particles as steam
            particles.forEach((system) => {
                const posAttr = system.mesh.geometry.attributes.position;
                const positions = posAttr.array;
                
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i + 1] += system.speeds[i / 3];
                    
                    // Reset particle when too high
                    if (positions[i + 1] > 2.5) {
                        positions[i + 1] = -1.8;
                        positions[i] = (Math.random() - 0.5) * 1.6;
                    }
                    
                    // Gentle horizontal sway
                    positions[i] += Math.sin(time * 2 + i) * 0.002;
                }
                
                posAttr.needsUpdate = true;
            });
            
            // Camera bob
            camera.position.y = 0.8 + Math.sin(time * 0.8) * 0.1;
            camera.lookAt(0, 0.1, 0);
            
            // Very subtle light pulse
            const light = scene.children.find(child => child instanceof THREE.PointLight && child.color.getHex() === 0xff8800);
            if (light) {
                light.intensity = 3 + Math.sin(time * 4) * 0.8;
            }
            
            renderer.render(scene, camera);
        }
        
        // Auto start
        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
